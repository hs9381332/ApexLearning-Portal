<html>
<head>
<title> APP </title>
<style>
/* Remove default margins and disable scrollbars on the main page */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden; 
}

/* Force the iframe to fill the entire viewport */
.fullscreen-iframe {
  width: 100vw;
  height: 100vh;
  border: none;
  display: block;
} 
</style>
</head>
<body>
<iframe src="https://rolexcoderz.in/" class="fullscreen-iframe" title="Full Screen Website"></iframe>
</body>
</html>
